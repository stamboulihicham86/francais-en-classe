<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz A0</title><style>body{font:18px system-ui;max-width:800px;margin:auto;padding:20px;background:#f3faf7;color:#163d34}section{background:white;padding:18px;margin:15px 0;border-radius:12px}button,select{font:inherit;padding:10px;margin:5px}button{cursor:pointer}label{display:block;margin:8px}header{background:#116b60;color:white;padding:20px;border-radius:12px}</style><header><h1>Premiers quiz A0</h1><p>Alphabet, voyelles, lettres, prénoms et syllabes</p><a style="color:white" href="index.html">Retour aux 210 leçons</a></header><p>Choisis une leçon et, si nécessaire, affiche la traduction.</p><select id="lesson"><option value="0">1. Alphabet</option><option value="1">2. Voyelles et consonnes</option><option value="2">3. Majuscules et minuscules</option><option value="3">4. Épeler son prénom</option><option value="4">5. Premiers sons</option></select><select id="lang"><option value="fr">Français</option><option value="ar">العربية الفصحى</option><option value="darija">الدارجة المغربية</option></select><div id="questions"></div><button id="check">Corriger</button><p id="result" role="status"></p><script>
const data=[
[["Première lettre de Salma ?","الحرف الأول من سلمى؟","أول حرف فسمية سلمى؟",["S","M","A"],0],["Minuscule de B ?","الحرف الصغير لـ B؟","الحرف الصغير ديال B؟",["d","b","p"],1],["Lettre manquante : A M _ N E","الحرف الناقص؟","الحرف اللي ناقص؟",["O","I","U"],1],["Dernière lettre de Fatima ?","الحرف الأخير من فاطمة؟","آخر حرف ففاطمة؟",["F","M","A"],2]],
[["Quelle lettre est une voyelle ?","أي حرف علّة؟","أشنو حرف العلة؟",["B","A","T"],1],["Combien de voyelles écrites, avec Y ?","كم حرف علّة مع Y؟","شحال من حرف علة مع Y؟",["5","6","7"],1],["Quelle lettre est une consonne ?","أي حرف ساكن؟","أشنو الحرف الساكن؟",["O","M","E"],1],["Première voyelle d'Amine ?","أول حرف علّة في أمين؟","أول حرف علة فأمين؟",["A","M","N"],0]],
[["Minuscule de M ?","الحرف الصغير لـ M؟","الحرف الصغير ديال M؟",["n","m","w"],1],["Majuscule de s ?","الحرف الكبير لـ s؟","الحرف الكبير ديال s؟",["C","S","Z"],1],["Quelle paire est correcte ?","أي زوج صحيح؟","أشنو الزوج الصحيح؟",["P / q","D / d","B / p"],1],["Minuscule de A ?","الحرف الصغير لـ A؟","الحرف الصغير ديال A؟",["a","o","e"],0]],
[["Comment épeler Amine ?","كيف نتهجّى أمين؟","كيفاش كنهجّاو أمين؟",["A-M-I-N-E","A-N-I-M-E","A-M-E-N-I"],0],["Comment épeler Salma ?","كيف نتهجّى سلمى؟","كيفاش كنهجّاو سلمى؟",["S-A-M-L-A","S-A-L-M-A","S-L-A-M-A"],1],["Après Y dans Yassine ?","الحرف بعد Y في ياسين؟","الحرف من بعد Y في ياسين؟",["S","A","I"],1],["Comment demander l'orthographe ?","كيف نطلب تهجئة الاسم؟","كيفاش نسول على تهجئة السمية؟",["Quel âge as-tu ?","Où habites-tu ?","Comment ça s'écrit ?"],2]],
[["Syllabes avec M ?","مقاطع تبدأ بـ M؟","مقاطع كتبدا بـ M؟",["ma-mi-mo","pa-pi-po","la-li-lo"],0],["Syllabe répétée dans papa ?","المقطع المتكرر في papa؟","المقطع اللي كيتعاود فـ papa؟",["pi","pa","po"],1],["L + A donne…","L و A يعطيان…","L و A كيعطيو…",["li","lo","la"],2],["mo + to donne…","ما الكلمة الناتجة؟","شنو الكلمة الناتجة؟",["moto","mato","tomo"],0]]
];const q=document.getElementById("questions"),r=document.getElementById("result"),lesson=document.getElementById("lesson"),lang=document.getElementById("lang");function draw(){q.innerHTML=data[+lesson.value].map((a,i)=>'<section><strong>'+(i+1)+'. '+a[0]+'</strong>'+(lang.value!=="fr"?'<p dir="rtl">'+a[lang.value==="ar"?1:2]+'</p>':'')+a[3].map((v,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+v+'</label>').join('')+'<p id="f'+i+'"></p></section>').join('');r.textContent=""}const n=Number(new URLSearchParams(location.search).get('lecon'));if(n>=1&&n<=5)lesson.value=String(n-1);lesson.onchange=draw;lang.onchange=draw;document.getElementById("check").onclick=()=>{let s=0;data[+lesson.value].forEach((a,i)=>{let v=q.querySelector('input[name=q'+i+']:checked');let ok=v&&+v.value===a[4];if(ok)s++;document.getElementById("f"+i).textContent=ok?"Bonne réponse !":"Réponse : "+a[3][a[4]]});r.textContent="Résultat : "+s+" / 4"};draw();
</script></html>
